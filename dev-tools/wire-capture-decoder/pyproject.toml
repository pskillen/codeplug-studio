[project]
name = "wire-capture-decoder"
version = "0.1.0"
description = "Decode USBPcap/Wireshark captures of the AT-D890UV CPS wire protocol into structured protocol frames."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wire-capture-decoder = "wire_capture_decoder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
