name: Deploy next

on:
  push:
    branches:
      - main

# android-release.yaml needs this permission, even if it doesn't always upload
permissions:
  contents: write

jobs:
  deploy:
    uses: ./.github/workflows/cloudflare-pages.yaml
    secrets: inherit
    with:
      build_env: main
      cloudflare_branch: next

  android:
    uses: ./.github/workflows/android-release.yaml
    secrets: inherit
    with:
      build_env: main
      # AAB for Play Internal Testing via android-play-upload-manual (source=main).
      # Not published inline — Play often requires Internal before Closed Testing.
      build_aab: true
