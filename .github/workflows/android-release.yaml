name: Build Android APK

on:
  workflow_call:
    inputs:
      build_env:
        description: Same vocabulary as Cloudflare Pages (prod|staging|main|dev)
        required: true
        type: string
      build_version:
        description: Version string for footer / APK name (e.g. release tag). Defaults to short git SHA.
        required: false
        type: string
        default: ''
      attach_to_release:
        description: Attach the signed APK to the GitHub Release that triggered the caller
        required: false
        type: boolean
        default: false
      build_aab:
        description: Also build a signed .aab (Play Store bundle). Kept as a workflow artifact only, never attached to the Release.
        required: false
        type: boolean
        default: false
      play_track:
        description: Play track to ensure this version on (beta / production). Empty skips Play.
        required: false
        type: string
        default: ''
      publish_to_play_track:
        description: Deprecated alias for play_track (dropped once callers switch)
        required: false
        type: string
        default: ''

# write needed to attach APK to GitHub Releases; artifact upload works with read alone
permissions:
  contents: write

concurrency:
  group: ${{ (inputs.play_track != '' || inputs.publish_to_play_track != '') && 'android-play-publisher' || format('android-apk-{0}', inputs.build_env) }}
  cancel-in-progress: ${{ inputs.play_track == '' && inputs.publish_to_play_track == '' }}

jobs:
  preflight:
    if: ${{ inputs.play_track != '' || inputs.publish_to_play_track != '' }}
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.preflight.outputs.action }}
      version_code: ${{ steps.preflight.outputs.version_code }}
      version_name: ${{ steps.preflight.outputs.version_name }}
      play_track: ${{ steps.track.outputs.play_track }}
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Play track
        id: track
        run: |
          TRACK="${{ inputs.play_track }}"
          if [ -z "${TRACK}" ]; then
            TRACK="${{ inputs.publish_to_play_track }}"
          fi
          echo "play_track=${TRACK}" >> "$GITHUB_OUTPUT"

      - name: Play preflight
        id: preflight
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
        run: node scripts/play/preflight.mjs

  build-apk:
    needs: [preflight]
    if: ${{ always() && !cancelled() && (needs.preflight.result == 'skipped' || needs.preflight.outputs.action == 'upload') }}
    runs-on: ubuntu-latest
    # secrets cannot be referenced in `if:` — map to env first, then gate on env
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Set build version
        run: |
          if [ -n "${{ inputs.build_version }}" ]; then
            VERSION="${{ inputs.build_version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "BUILD_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=${VERSION}" >> "$GITHUB_ENV"
          if [ -n "${{ needs.preflight.outputs.version_code }}" ]; then
            CODE="${{ needs.preflight.outputs.version_code }}"
          else
            CODE="${{ github.run_number }}"
          fi
          echo "ANDROID_VERSION_CODE=${CODE}" >> "$GITHUB_ENV"
          echo "BUILD_ENV=${{ inputs.build_env }}" >> "$GITHUB_ENV"
          echo "Version=${VERSION} BUILD_ENV=${{ inputs.build_env }} versionCode=${CODE}"

      - name: Set GA measurement ID
        run: |
          case "${{ inputs.build_env }}" in
            prod)
              echo "VITE_GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID }}" >> "$GITHUB_ENV"
              ;;
            staging|main|dev)
              echo "VITE_GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID_PREPROD }}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unexpected build_env: ${{ inputs.build_env }}" >&2
              exit 1
              ;;
          esac

      - name: Set Android Google OAuth client id
        run: |
          echo "VITE_GOOGLE_ANDROID_CLIENT_ID=${{ secrets.ANDROID_GOOGLE_OAUTH_CLIENT_ID }}" >> "$GITHUB_ENV"

      - name: Build SPA
        env:
          BUILD_ENV: ${{ inputs.build_env }}
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          VITE_GA_MEASUREMENT_ID: ${{ env.VITE_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_ANDROID_CLIENT_ID: ${{ env.VITE_GOOGLE_ANDROID_CLIENT_ID }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_FILE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_FILE }}
        run: |
          cd android
          ./gradlew assembleRelease
          RELEASE_DIR="app/build/outputs/apk/release"
          SRC="$(ls -1 "${RELEASE_DIR}"/*.apk | head -n 1)"
          DEST="${RELEASE_DIR}/codeplug-studio-${ANDROID_VERSION_NAME}.apk"
          cp "${SRC}" "${DEST}"
          echo "APK_PATH=${DEST}" >> "$GITHUB_ENV"
          echo "Built ${DEST} (versionName=${ANDROID_VERSION_NAME} versionCode=${ANDROID_VERSION_CODE} BUILD_ENV=${BUILD_ENV})"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk-${{ inputs.build_env }}
          path: android/app/build/outputs/apk/release/codeplug-studio-*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APK to GitHub Release
        if: ${{ inputs.attach_to_release }}
        uses: softprops/action-gh-release@v3
        with:
          files: android/app/build/outputs/apk/release/codeplug-studio-*.apk
          fail_on_unmatched_files: true

      - name: Build Release AAB
        if: ${{ inputs.build_aab }}
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_FILE }}
        run: |
          cd android
          ./gradlew bundleRelease
          RELEASE_DIR="app/build/outputs/bundle/release"
          SRC="$(ls -1 "${RELEASE_DIR}"/*.aab | head -n 1)"
          DEST="${RELEASE_DIR}/codeplug-studio-${ANDROID_VERSION_NAME}.aab"
          cp "${SRC}" "${DEST}"
          echo "AAB_PATH=${DEST}" >> "$GITHUB_ENV"
          echo "Built ${DEST} (versionName=${ANDROID_VERSION_NAME} versionCode=${ANDROID_VERSION_CODE} BUILD_ENV=${BUILD_ENV})"

      - name: Upload AAB workflow artifact
        if: ${{ inputs.build_aab }}
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab-${{ inputs.build_env }}
          path: android/app/build/outputs/bundle/release/codeplug-studio-*.aab
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [preflight, build-apk]
    if: ${{ always() && !cancelled() && needs.preflight.result == 'success' && (needs.preflight.outputs.action == 'reconcile' || needs.build-apk.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      BUILD_VERSION: ${{ inputs.build_version }}
      PLAY_TRACK: ${{ needs.preflight.outputs.play_track }}
      RELEASE_NOTES: ${{ github.event.release.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download AAB artifact
        if: ${{ needs.preflight.outputs.action == 'upload' }}
        uses: actions/download-artifact@v7
        with:
          name: app-release-aab-${{ inputs.build_env }}
          path: ./aab-download

      - name: Ensure version on Play track
        run: |
          set -euo pipefail
          if [ "${{ needs.preflight.outputs.action }}" = "upload" ]; then
            AAB_PATH="$(find ./aab-download -name 'codeplug-studio-*.aab' | head -n 1)"
            if [ -z "${AAB_PATH}" ]; then
              echo "::error::No AAB artifact found to upload"
              exit 1
            fi
            export AAB_PATH
          fi
          node scripts/play/ensure-on-track.mjs
