name: Deploy staging

on:
  release:
    types: [prereleased]

# android-release.yaml needs this permission
permissions:
  contents: write

jobs:
  deploy:
    uses: ./.github/workflows/cloudflare-pages.yaml
    secrets: inherit
    with:
      build_env: staging
      build_version: ${{ github.event.release.tag_name }}
      cloudflare_branch: staging

  android:
    uses: ./.github/workflows/android-release.yaml
    secrets: inherit
    with:
      build_env: staging
      build_version: ${{ github.event.release.tag_name }}
      attach_to_release: true
      build_aab: true
      # Play API id for the default Closed Testing track — confirm against the real
      # Play Console track once created; adjust if it's a custom track name.
      publish_to_play_track: alpha
