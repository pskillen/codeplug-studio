name: Publish Android AAB to Play Store (manual)

# On-demand push of an already-built AAB artifact to a chosen Play track with
# either draft or completed (rolled-out) release status. Does not rebuild —
# reuses the AAB from a staging or prod android-release run.
#
# Use this while the Play Console app is still Draft (status=draft), to retry
# an upload, or to force a completed rollout after the app leaves Draft —
# without waiting for the weekly production job or a new pre-release.

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play Store track API id (alpha = default Closed Testing)
        required: true
        type: choice
        options:
          - alpha
          - internal
          - production
        default: alpha
      status:
        description: Play release status — draft while Console app is Draft; completed rolls out immediately
        required: true
        type: choice
        options:
          - draft
          - completed
        default: draft
      source:
        description: Which CI env's AAB artifact to upload (app-release-aab-<source>)
        required: true
        type: choice
        options:
          - staging
          - prod
        default: staging
      release_tag:
        description: Optional GitHub release tag whose AAB to publish (e.g. 2.5.0-rc.0). Empty = newest source release run that still has the AAB artifact (failed Play publishes are OK).
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: android-play-upload-manual
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TRACK: ${{ inputs.track }}
      STATUS: ${{ inputs.status }}
      SOURCE: ${{ inputs.source }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve AAB source run
        id: resolve
        run: |
          set -euo pipefail

          case "${SOURCE}" in
            staging) WORKFLOW=staging.yaml ;;
            prod) WORKFLOW=prod.yaml ;;
            *)
              echo "::error::Unexpected source: ${SOURCE}"
              exit 1
              ;;
          esac

          ARTIFACT="app-release-aab-${SOURCE}"
          TAG="${RELEASE_TAG#v}"
          REPO="${GITHUB_REPOSITORY}"

          # gh --jq does not accept jq --arg flags (it treats them as the
          # expression / subcommands). Always pipe JSON to jq instead.
          run_has_aab() {
            local run_id="$1"
            local count
            count="$(gh api "repos/${REPO}/actions/runs/${run_id}/artifacts" \
              | jq -r --arg n "${ARTIFACT}" \
                '[.artifacts[] | select(.name == $n and .expired == false)] | length')"
            [ "${count}" -gt 0 ]
          }

          resolve_version_for_sha() {
            local sha="$1"
            local run_id="$2"
            local version
            version="$(git describe --tags --exact-match "${sha}" 2>/dev/null || true)"
            if [ -z "${version}" ]; then
              version="$(git name-rev --name-only --tags "${sha}" 2>/dev/null || true)"
              version="${version#tags/}"
              version="${version%%^*}"
            fi
            if [ -z "${version}" ] || [ "${version}" = "undefined" ]; then
              version="run-${run_id}"
            fi
            printf '%s\n' "${version}"
          }

          # Prefer release-triggered runs that still have the AAB artifact.
          # Include failures: staging often fails on the Play publish step
          # after the AAB artifact has already been uploaded.
          CANDIDATES_JSON="$(gh run list --workflow="${WORKFLOW}" --event release \
            --json databaseId,headSha,conclusion --limit 50)"

          RUN_ID=""
          TARGET_SHA=""
          VERSION=""

          if [ -n "${TAG}" ]; then
            if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "::error::Release tag not found: ${TAG}"
              exit 1
            fi
            TARGET_SHA="$(git rev-list -n 1 "${TAG}")"
            while IFS= read -r run_id; do
              [ -z "${run_id}" ] && continue
              if run_has_aab "${run_id}"; then
                RUN_ID="${run_id}"
                break
              fi
              echo "Run ${run_id} matches ${TAG} but has no unexpired ${ARTIFACT} — trying next."
            done < <(printf '%s\n' "${CANDIDATES_JSON}" | jq -r --arg sha "${TARGET_SHA}" \
              '[.[] | select(.headSha == $sha)] | .[].databaseId')
            if [ -z "${RUN_ID}" ]; then
              echo "::error::No ${WORKFLOW} release run for tag ${TAG} (commit ${TARGET_SHA}) has unexpired artifact ${ARTIFACT}."
              exit 1
            fi
            VERSION="${TAG}"
            echo "Using tag ${TAG} → commit ${TARGET_SHA} → ${WORKFLOW} run ${RUN_ID}"
          else
            while IFS= read -r line; do
              [ -z "${line}" ] && continue
              run_id="${line%%$'\t'*}"
              sha="${line#*$'\t'}"
              if run_has_aab "${run_id}"; then
                RUN_ID="${run_id}"
                TARGET_SHA="${sha}"
                VERSION="$(resolve_version_for_sha "${TARGET_SHA}" "${RUN_ID}")"
                break
              fi
              echo "Run ${run_id} has no unexpired ${ARTIFACT} — trying next."
            done < <(printf '%s\n' "${CANDIDATES_JSON}" | jq -r \
              '.[] | "\(.databaseId)\t\(.headSha)"')
            if [ -z "${RUN_ID}" ]; then
              echo "::error::No recent ${WORKFLOW} release run has unexpired artifact ${ARTIFACT}."
              exit 1
            fi
            echo "Using ${WORKFLOW} run ${RUN_ID} (commit ${TARGET_SHA}, version ${VERSION}) with ${ARTIFACT}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "workflow=${WORKFLOW}" >> "$GITHUB_OUTPUT"

      - name: Download AAB artifact
        run: |
          set -euo pipefail
          gh run download "${{ steps.resolve.outputs.run_id }}" \
            -n "${{ steps.resolve.outputs.artifact }}" \
            -D ./aab-download
          ls -la ./aab-download
          test -n "$(ls -1 ./aab-download/codeplug-studio-*.aab 2>/dev/null | head -n 1)"

      - name: Publish AAB to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.mm9pdy.codeplugstudio
          releaseFiles: ./aab-download/codeplug-studio-*.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Tag production completed publish
        if: ${{ inputs.track == 'production' && inputs.status == 'completed' }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.version }}"
          SHA="${{ steps.resolve.outputs.target_sha }}"
          case "${VERSION}" in
            run-*|'')
              echo "::warning::Skipping android-* tag — could not resolve a SemVer release tag for this run."
              exit 0
              ;;
          esac
          if git rev-parse -q --verify "refs/tags/android-${VERSION}" >/dev/null; then
            echo "Tag android-${VERSION} already exists — leaving it."
            exit 0
          fi
          git tag "android-${VERSION}" "${SHA}"
          git push origin "android-${VERSION}"
          echo "Tagged and pushed android-${VERSION}"
