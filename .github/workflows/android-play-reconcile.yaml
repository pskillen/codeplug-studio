name: Reconcile Android Play track

# Re-assert a version Play already holds onto the track implied by the tag.
# Does not build. Missing bundles fail — publish a GitHub pre-release or full
# release instead.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. 1.2.3-rc.4 or 1.2.3). Track is derived; -rc → Open testing, otherwise Production.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-play-publisher
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      BUILD_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure version on mapped Play track
        run: |
          set -euo pipefail
          PLAY_TRACK="$(node scripts/play/version-code.mjs --track "${BUILD_VERSION}")"
          export PLAY_TRACK
          echo "Ensuring ${BUILD_VERSION} on ${PLAY_TRACK}"
          node scripts/play/ensure-on-track.mjs
