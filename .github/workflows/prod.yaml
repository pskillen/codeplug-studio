name: Deploy production

on:
  release:
    types: [released]

# android-release.yaml needs this permission
permissions:
  contents: write

jobs:
  deploy:
    uses: ./.github/workflows/cloudflare-pages.yaml
    secrets: inherit
    with:
      build_env: prod
      build_version: ${{ github.event.release.tag_name }}

  android:
    uses: ./.github/workflows/android-release.yaml
    secrets: inherit
    with:
      build_env: prod
      build_version: ${{ github.event.release.tag_name }}
      attach_to_release: true
      # AAB is kept as a workflow artifact only — android-play-publish.yaml batches
      # the actual Production push weekly so real users aren't spammed with updates.
      build_aab: true
