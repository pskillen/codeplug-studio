name: Android Release APK

on:
  release:
    types: [published, prereleased]
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      build_env:
        description: Deploy environment (same vocabulary as Cloudflare Pages)
        required: true
        type: choice
        options:
          - prod
          - staging
          - main
          - dev
        default: dev

# write needed to attach APK to GitHub Releases; artifact upload works with read alone
permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # secrets cannot be referenced in `if:` — map to env first, then gate on env
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Set build version and environment
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          VERSION="${TAG_NAME#v}"
          echo "BUILD_VERSION=${VERSION}" >> "$GITHUB_ENV"
          # Native package identity (Play / sideload updates)
          echo "ANDROID_VERSION_NAME=${VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

          # Match Cloudflare Pages BUILD_ENV vocabulary (prod|staging|main|dev)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_ENV="${{ inputs.build_env }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              BUILD_ENV=staging
            else
              BUILD_ENV=prod
            fi
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "dev" ]; then
            BUILD_ENV=dev
          else
            echo "Unable to map trigger to BUILD_ENV" >&2
            exit 1
          fi
          echo "BUILD_ENV=${BUILD_ENV}" >> "$GITHUB_ENV"
          echo "Mapped BUILD_ENV=${BUILD_ENV} (event=${{ github.event_name }})"

      - name: Set GA measurement ID
        run: |
          case "${BUILD_ENV}" in
            prod)
              echo "VITE_GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID }}" >> "$GITHUB_ENV"
              ;;
            staging|main|dev)
              echo "VITE_GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID_PREPROD }}" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Build SPA
        env:
          BUILD_ENV: ${{ env.BUILD_ENV }}
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          VITE_GA_MEASUREMENT_ID: ${{ env.VITE_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_FILE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          # Prefer GITHUB_ENV from prior steps; only re-pass keystore path (set conditionally).
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_FILE }}
        run: |
          cd android
          ./gradlew assembleRelease
          # Stable artifact name for Releases / download UX
          RELEASE_DIR="app/build/outputs/apk/release"
          SRC="$(ls -1 "${RELEASE_DIR}"/*.apk | head -n 1)"
          DEST="${RELEASE_DIR}/codeplug-studio-${ANDROID_VERSION_NAME}.apk"
          cp "${SRC}" "${DEST}"
          echo "APK_PATH=${DEST}" >> "$GITHUB_ENV"
          echo "Built ${DEST} (versionName=${ANDROID_VERSION_NAME} versionCode=${ANDROID_VERSION_CODE} BUILD_ENV=${BUILD_ENV})"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/codeplug-studio-*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: android/app/build/outputs/apk/release/codeplug-studio-*.apk
          fail_on_unmatched_files: true
